<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음식 사진 분류</title>
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --text: #222; --muted: #6b6b6b;
    --accent: #e8590c; --border: #e3ded7; --bar: #f1ece6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17161a; --card: #222127; --text: #eee; --muted: #a3a1a8;
            --accent: #ff8a3d; --border: #36343c; --bar: #2c2a31; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  details.key { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
                padding: 12px 16px; margin-bottom: 16px; }
  details.key summary { cursor: pointer; font-weight: 600; }
  details.key input[type=password] { width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px;
                border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: .95rem; }
  details.key label.remember { display: block; margin-top: 8px; font-size: .9rem; color: var(--muted); }
  details.key p { font-size: .85rem; color: var(--muted); margin: 8px 0 0; line-height: 1.5; }
  #drop { display: block; border: 2px dashed var(--border); border-radius: 14px; background: var(--card);
          padding: 28px 16px; text-align: center; cursor: pointer; transition: border-color .15s; }
  #drop.over, #drop:hover { border-color: var(--accent); }
  #drop img { max-width: 100%; max-height: 320px; border-radius: 10px; display: none; margin: 0 auto 12px; }
  #drop.has-image img { display: block; }
  #drop.has-image .hint { font-size: .9rem; }
  .hint { color: var(--muted); }
  button { margin-top: 16px; width: 100%; padding: 14px; border: 0; border-radius: 10px;
           background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-top: 20px; }
  .name { font-size: 1.5rem; font-weight: 700; }
  .en { color: var(--muted); margin-left: 6px; font-weight: 400; font-size: 1rem; }
  .tags { margin: 10px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: var(--bar); border-radius: 999px; padding: 4px 10px; font-size: .85rem; }
  .meter { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; margin: 4px 0 14px; }
  .meter > div { height: 100%; background: var(--accent); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .error { color: #d6336c; }
  ul.alt { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<main>
  <h1>🍽️ 음식 사진 분류</h1>
  <p class="sub">사진을 올리면 어떤 음식인지 알려드려요.</p>

  <details class="key" id="keyBox">
    <summary>Claude API 키</summary>
    <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
    <label class="remember"><input id="remember" type="checkbox"> 이 브라우저에 키 기억하기</label>
    <p>키는 이 브라우저에서 Anthropic API(api.anthropic.com)로만 직접 전송되며, 이 사이트에는 저장되지 않습니다.
       공용 컴퓨터에서는 "기억하기"를 끄세요. 키는 <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">Claude Console</a>에서 발급받을 수 있습니다.</p>
  </details>

  <label id="drop">
    <img id="preview" alt="미리보기">
    <div class="hint" id="hint">여기를 눌러 사진을 선택하거나 끌어다 놓으세요<br>(JPEG · PNG · GIF · WEBP, 5MB 이하)</div>
    <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
  </label>
  <button id="go" disabled>분석하기</button>

  <div id="result"></div>
</main>
<script>
const MODEL = "claude-opus-5-5";
const MAX = 5 * 1024 * 1024;
const TYPES = ["image/jpeg", "image/png", "image/gif", "image/webp"];
const KEY_STORAGE = "food-classifier-api-key";

const SYSTEM_PROMPT = `당신은 음식 사진을 분류하는 전문가입니다.
사진 속 대표 음식을 하나 골라 이름, 요리 국적, 음식 분류, 주요 재료, 1인분 기준 추정 칼로리를 판단하세요.
- 음식 이름은 한국에서 통용되는 이름(한국어)과 영어 이름을 함께 제시합니다.
- 확신(confidence)은 0~1 사이 값으로, 사진만으로 판단하기 애매하면 낮게 잡으세요.
- 헷갈릴 만한 다른 후보가 있으면 alternatives에 최대 3개까지 넣습니다.
- 사진에 음식이 없으면 is_food를 false로 하고, 이름 필드는 빈 문자열, 목록은 빈 배열, 칼로리는 null로 둡니다.
- description에는 판단 근거를 한두 문장으로 한국어로 적습니다.`;

const OUTPUT_SCHEMA = {
  type: "object",
  properties: {
    is_food: { type: "boolean" },
    name_ko: { type: "string" },
    name_en: { type: "string" },
    cuisine: { type: "string" },
    category: { type: "string" },
    confidence: { type: "number" },
    ingredients: { type: "array", items: { type: "string" } },
    estimated_calories_kcal: { type: ["integer", "null"] },
    description: { type: "string" },
    alternatives: {
      type: "array",
      items: {
        type: "object",
        properties: { name: { type: "string" }, confidence: { type: "number" } },
        required: ["name", "confidence"],
        additionalProperties: false,
      },
    },
  },
  required: ["is_food", "name_ko", "name_en", "cuisine", "category", "confidence",
             "ingredients", "estimated_calories_kcal", "description", "alternatives"],
  additionalProperties: false,
};

const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), go = $("go"), result = $("result");
const keyInput = $("apiKey"), remember = $("remember");
let current = null;

function storage(fn) { try { return fn(window.localStorage); } catch { return null; } }

const savedKey = storage((s) => s.getItem(KEY_STORAGE));
if (savedKey) { keyInput.value = savedKey; remember.checked = true; } else { $("keyBox").open = true; }

function syncKey() {
  storage((s) => remember.checked && keyInput.value ? s.setItem(KEY_STORAGE, keyInput.value) : s.removeItem(KEY_STORAGE));
}
keyInput.addEventListener("change", syncKey);
remember.addEventListener("change", syncKey);

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function pick(file) {
  if (!file) return;
  if (!TYPES.includes(file.type)) { showError("JPEG, PNG, GIF, WEBP 이미지만 지원합니다."); return; }
  if (file.size > MAX) { showError("이미지는 5MB 이하만 업로드할 수 있습니다."); return; }
  current = file;
  $("preview").src = URL.createObjectURL(file);
  drop.classList.add("has-image");
  $("hint").textContent = "다른 사진을 선택하려면 다시 누르세요";
  go.disabled = false;
  result.innerHTML = "";
}

fileInput.addEventListener("change", () => pick(fileInput.files[0]));
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); });

function showError(msg) {
  result.innerHTML = `<div class="card error">${esc(msg)}</div>`;
}

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",", 2)[1]);
    reader.onerror = () => reject(new Error("파일을 읽을 수 없습니다."));
    reader.readAsDataURL(file);
  });
}

const STATUS_MESSAGES = {
  400: "이미지를 처리할 수 없습니다. 다른 사진으로 시도해 주세요.",
  401: "API 키가 올바르지 않습니다.",
  403: "이 API 키로는 요청할 권한이 없습니다.",
  429: "요청이 많습니다. 잠시 후 다시 시도해 주세요.",
  529: "분석 서버가 혼잡합니다. 잠시 후 다시 시도해 주세요.",
};

async function classify(file, apiKey) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2026-10-21",
      "anthropic-beta": "server-side-fallback-2026-07-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 4096,
      fallbacks: "default",
      thinking: { type: "adaptive" },
      output_config: { effort: "low", format: { type: "json_schema", schema: OUTPUT_SCHEMA } },
      system: SYSTEM_PROMPT,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: file.type, data: await toBase64(file) } },
          { type: "text", text: "이 사진의 음식을 분류해 주세요." },
        ],
      }],
    }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    console.error("Claude API error", res.status, data);
    throw new Error(STATUS_MESSAGES[res.status] || `분석 서버에 문제가 발생했습니다 (${res.status}).`);
  }
  if (data.stop_reason === "refusal") throw new Error("모델이 이 이미지의 분석을 거절했습니다.");
  if (data.stop_reason === "max_tokens") throw new Error("응답이 너무 길어 중간에 끊겼습니다.");
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  if (!text) throw new Error("모델 응답이 비어 있습니다.");
  return JSON.parse(text);
}

function render(r) {
  if (!r.is_food) {
    result.innerHTML = `<div class="card"><div class="name">음식이 아닌 것 같아요 🤔</div><p>${esc(r.description)}</p></div>`;
    return;
  }
  const pct = Math.round(Math.max(0, Math.min(1, r.confidence)) * 100);
  const alts = r.alternatives.length
    ? `<dt>다른 후보</dt><dd><ul class="alt">${r.alternatives.map((a) =>
        `<li>${esc(a.name)} (${Math.round(a.confidence * 100)}%)</li>`).join("")}</ul></dd>` : "";
  result.innerHTML = `
    <div class="card">
      <div class="name">${esc(r.name_ko)}<span class="en">${esc(r.name_en)}</span></div>
      <div class="tags"><span class="tag">${esc(r.cuisine)}</span><span class="tag">${esc(r.category)}</span></div>
      <div class="hint">확신도 ${pct}%</div>
      <div class="meter"><div style="width:${pct}%"></div></div>
      <dl>
        <dt>주요 재료</dt><dd>${esc(r.ingredients.join(", ") || "-")}</dd>
        <dt>추정 칼로리</dt><dd>${r.estimated_calories_kcal != null ? esc(r.estimated_calories_kcal) + " kcal (1인분)" : "-"}</dd>
        <dt>판단 근거</dt><dd>${esc(r.description)}</dd>
        ${alts}
      </dl>
    </div>`;
}

go.addEventListener("click", async () => {
  if (!current) return;
  const apiKey = keyInput.value.trim();
  if (!apiKey) { $("keyBox").open = true; keyInput.focus(); showError("먼저 Claude API 키를 입력해 주세요."); return; }
  syncKey();
  go.disabled = true;
  go.textContent = "분석 중…";
  result.innerHTML = "";
  try {
    render(await classify(current, apiKey));
  } catch (e) {
    showError(e instanceof TypeError ? "분석 서버에 연결할 수 없습니다." : e.message);
  } finally {
    go.disabled = false;
    go.textContent = "분석하기";
  }
});
</script>
</body>
</html>
