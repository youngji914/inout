<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>칼로리 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;600;700&family=Noto+Serif+KR:wght@300&display=swap">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="app"><p class="center muted">불러오는 중…</p></div>
<nav id="tabs" hidden>
  <div class="inner">
    <button data-view="day">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>하루
    </button>
    <button data-view="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>달력
    </button>
    <button data-view="profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-3.5 3.8-5.5 7-5.5s6 2 7 5.5"/></svg>내 정보
    </button>
  </div>
</nav>
<dialog id="modal"></dialog>
<dialog id="lightbox"><img alt=""></dialog>
<div id="toast" hidden></div>
</body>
</html>
