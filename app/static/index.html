<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>음식 사진 분류</title>
<style>
  :root {
    --bg: #f7f5f2; --card: #ffffff; --text: #222; --muted: #6b6b6b;
    --accent: #e8590c; --border: #e3ded7; --bar: #f1ece6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17161a; --card: #222127; --text: #eee; --muted: #a3a1a8;
            --accent: #ff8a3d; --border: #36343c; --bar: #2c2a31; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         background: var(--bg); color: var(--text); }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  #drop { display: block; border: 2px dashed var(--border); border-radius: 14px; background: var(--card);
          padding: 28px 16px; text-align: center; cursor: pointer; transition: border-color .15s; }
  #drop.over, #drop:hover { border-color: var(--accent); }
  #drop img { max-width: 100%; max-height: 320px; border-radius: 10px; display: none; margin: 0 auto 12px; }
  #drop.has-image img { display: block; }
  #drop.has-image .hint { font-size: .9rem; }
  .hint { color: var(--muted); }
  button { margin-top: 16px; width: 100%; padding: 14px; border: 0; border-radius: 10px;
           background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-top: 20px; }
  .name { font-size: 1.5rem; font-weight: 700; }
  .en { color: var(--muted); margin-left: 6px; font-weight: 400; font-size: 1rem; }
  .tags { margin: 10px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: var(--bar); border-radius: 999px; padding: 4px 10px; font-size: .85rem; }
  .meter { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; margin: 4px 0 14px; }
  .meter > div { height: 100%; background: var(--accent); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .error { color: #d6336c; }
  ul.alt { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<main>
  <h1>🍽️ 음식 사진 분류</h1>
  <p class="sub">사진을 올리면 어떤 음식인지 알려드려요.</p>

  <label id="drop">
    <img id="preview" alt="미리보기">
    <div class="hint" id="hint">여기를 눌러 사진을 선택하거나 끌어다 놓으세요<br>(JPEG · PNG · GIF · WEBP, 5MB 이하)</div>
    <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
  </label>
  <button id="go" disabled>분석하기</button>

  <div id="result"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const drop = $("drop"), fileInput = $("file"), go = $("go"), result = $("result");
const MAX = 5 * 1024 * 1024;
let current = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function pick(file) {
  if (!file) return;
  if (file.size > MAX) { showError("이미지는 5MB 이하만 업로드할 수 있습니다."); return; }
  current = file;
  $("preview").src = URL.createObjectURL(file);
  drop.classList.add("has-image");
  $("hint").textContent = "다른 사진을 선택하려면 다시 누르세요";
  go.disabled = false;
  result.innerHTML = "";
}

fileInput.addEventListener("change", () => pick(fileInput.files[0]));
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); pick(e.dataTransfer.files[0]); });

function showError(msg) {
  result.innerHTML = `<div class="card error">${esc(msg)}</div>`;
}

function render(r) {
  if (!r.is_food) {
    result.innerHTML = `<div class="card"><div class="name">음식이 아닌 것 같아요 🤔</div><p>${esc(r.description)}</p></div>`;
    return;
  }
  const pct = Math.round(Math.max(0, Math.min(1, r.confidence)) * 100);
  const alts = r.alternatives.length
    ? `<dt>다른 후보</dt><dd><ul class="alt">${r.alternatives.map((a) =>
        `<li>${esc(a.name)} (${Math.round(a.confidence * 100)}%)</li>`).join("")}</ul></dd>` : "";
  result.innerHTML = `
    <div class="card">
      <div class="name">${esc(r.name_ko)}<span class="en">${esc(r.name_en)}</span></div>
      <div class="tags"><span class="tag">${esc(r.cuisine)}</span><span class="tag">${esc(r.category)}</span></div>
      <div class="hint">확신도 ${pct}%</div>
      <div class="meter"><div style="width:${pct}%"></div></div>
      <dl>
        <dt>주요 재료</dt><dd>${esc(r.ingredients.join(", ") || "-")}</dd>
        <dt>추정 칼로리</dt><dd>${r.estimated_calories_kcal != null ? esc(r.estimated_calories_kcal) + " kcal (1인분)" : "-"}</dd>
        <dt>판단 근거</dt><dd>${esc(r.description)}</dd>
        ${alts}
      </dl>
    </div>`;
}

go.addEventListener("click", async () => {
  if (!current) return;
  go.disabled = true;
  go.textContent = "분석 중…";
  result.innerHTML = "";
  try {
    const body = new FormData();
    body.append("image", current);
    const res = await fetch("/api/classify", { method: "POST", body });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || `오류가 발생했습니다 (${res.status})`);
    render(data);
  } catch (e) {
    showError(e.message);
  } finally {
    go.disabled = false;
    go.textContent = "분석하기";
  }
});
</script>
</body>
</html>
