name: Supabase

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/api
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
      - run: deno task test

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check settings
        id: settings
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD 시크릿이나 SUPABASE_PROJECT_REF 변수가 없어 배포를 건너뜁니다. README를 참고해 설정하세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.settings.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.settings.outputs.ready == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.settings.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply database migrations
        if: steps.settings.outputs.ready == 'true'
        run: supabase db push
      - name: Deploy api function
        if: steps.settings.outputs.ready == 'true'
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
