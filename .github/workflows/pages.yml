name: Deploy to GitHub Pages

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages 환경은 기본 브랜치에서만 배포를 허용한다.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Write config.js
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$PROJECT_REF" ]; then
            echo "window.APP_CONFIG = { apiBase: \"https://${PROJECT_REF}.supabase.co/functions/v1/api\" };" > site/config.js
          else
            echo "::warning::SUPABASE_PROJECT_REF 변수가 없어 서버 주소 없이 배포합니다."
          fi
          cat site/config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
